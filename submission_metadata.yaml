# ============================================================================
ai_tools_used:
  - "Claude"
  - "GitHub Copilot"

ai_usage_summary: |
  I used Claude to bounce ideas off during development, mainly for debugging tricky
  edge cases in the honeypot detection and sanity-checking my scoring weights.
  Copilot handled autocomplete. The ranking script itself runs fully offline with
  zero external API calls.

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Offline ranker for the Senior AI Engineer role. First pass filters honeypot profiles
  by catching timeline contradictions and bogus skill claims. Second pass scores on
  four signal groups: technical fit (verified Redrob assessments + self-reported skills +
  recency-weighted career keywords), role fit (title, YoE, company type, location),
  engagement (response rate, login recency, notice period, GitHub, interview completion),
  and tiebreakers (education tier, recruiter saves, certifications). LangChain-only
  backgrounds and career trajectory regressions get deprioritized. Profile summaries
  are mined for retrieval/search mentions. About 10 seconds on a single CPU core.

