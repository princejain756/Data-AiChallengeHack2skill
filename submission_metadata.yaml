ai_tools_used:
  - "Claude"
  - "GitHub Copilot"

ai_usage_summary: |
  I used Claude to bounce ideas off during development — mainly for debugging tricky
  edge cases in the honeypot detection and sanity-checking my scoring weights.
  Copilot handled autocomplete. The ranking script itself runs fully offline with
  zero external API calls.

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Offline ranker for the Senior AI Engineer role. First pass filters out honeypot
  profiles by catching timeline contradictions and bogus skill claims. Second pass
  scores candidates on YoE fit, title relevance, vector-DB/search/embedding skills,
  and actual keyword evidence in their job descriptions. Third pass applies platform
  signal multipliers (response rate, login recency, notice period, GitHub activity)
  so inactive or unresponsive candidates drop down the list. Ties break on candidate ID.
  Runs in about 9 seconds on a single CPU core for 100K profiles.

